<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2>🎓 Scholarship Portal</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="scholarships.html">Scholarships</a>
            <a href="login.html">Login</a>
        </div>
    </nav>
</header>

<section class="form-section">
    <h2>Student Registration</h2>

    <form id="registerForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter phone number">

        <label for="category">Category</label>
        <select id="category">
            <option value="">Select Category</option>
            <option value="General">General</option>
            <option value="OBC">OBC</option>
            <option value="SC">SC</option>
            <option value="ST">ST</option>
            <option value="EWS">EWS</option>
        </select>

        <label for="income">Annual Family Income</label>
        <input type="number" id="income" placeholder="Enter annual income">

        <label for="college">College</label>
        <input type="text" id="college" placeholder="Enter college name">

        <label for="course">Course</label>
        <input type="text" id="course" placeholder="Enter course">

        <button type="submit" class="btn">Register</button>
        <p style="margin-top: 15px; text-align: center; color: #666; font-size: 14px;">
            Already have an account? <a href="login.html" style="color: #2563eb; font-weight: bold; text-decoration: none;">Login here</a>
        </p>
    </form>
</section>

<script src="js/script.js"></script>
</body>

</html>
